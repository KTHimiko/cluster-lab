# slurm.conf — cluster-lab
# Etapa 1: nó único (head acumula controlador e execução).
# No domingo, descomente node01/node02 e distribua este MESMO arquivo,
# idêntico, para os três nós.

ClusterName=lab
SlurmctldHost=head

SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

AuthType=auth/munge
ProctrackType=proctrack/linuxproc
ReturnToService=2

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# --- nós -------------------------------------------------------------
# Confira os valores reais dentro da VM com:  lscpu  e  free -m
# CPUs ou RealMemory maiores que a realidade deixam o nó em estado "down".
NodeName=head   CPUs=2 RealMemory=3800 State=UNKNOWN
# NodeName=node01 CPUs=2 RealMemory=3800 State=UNKNOWN
# NodeName=node02 CPUs=2 RealMemory=3800 State=UNKNOWN

# --- partições -------------------------------------------------------
PartitionName=debug Nodes=ALL Default=YES MaxTime=INFINITE State=UP
