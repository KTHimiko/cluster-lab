#cloud-config
# Template de provisionamento de nó. Use scripts/render-cloud-init.sh, que
# injeta a chave pública e o hostname, e scripts/make-seed.sh para o ISO.

hostname: head
fqdn: head.lab
prefer_fqdn_over_hostname: false
manage_etc_hosts: false   # gerenciamos /etc/hosts pelo config/hosts do cluster

users:
  - name: luan
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true
    ssh_authorized_keys:
      # >>> COLE AQUI a saída de `cat ~/.ssh/id_ed25519.pub` <<<
      - ssh-ed25519 SUBSTITUA_ESTA_LINHA_PELA_SUA_CHAVE_PUBLICA cluster-lab

package_update: true
packages:
  - vim
  - curl
  - htop
  - chrony
  # pilha do cluster: cada nó já nasce com o escalonador e a autenticação
  - slurm-wlm
  - munge
  - nfs-common

# Relógio sincronizado não é detalhe: MUNGE rejeita credencial com desvio de
# tempo entre os nós, e o erro que aparece não menciona relógio nenhum.
runcmd:
  - systemctl enable --now chrony

power_state:
  mode: reboot
  condition: true
