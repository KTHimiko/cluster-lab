# cgroup.conf — confinamento real de recursos
#
# POR QUE ESTE ARQUIVO EXISTE
# Sem ele, os limites do SLURM são declarações, não restrições. Um teste
# comprovou: um job que pediu 128 MB alocou 900 MB e terminou como COMPLETED.
#
# Num cluster de verdade isso é grave. O escalonador acha que alocou 128 MB e
# continua agendando outros jobs em cima disso; o job descontrolado consome a
# memória do nó e o núcleo do sistema mata processos de OUTROS usuários para
# recuperar. Uma pessoa derruba o trabalho de todas.
#
# Com cgroups, o núcleo do sistema confina o job ao que ele pediu. Estourar o
# limite mata só quem estourou.

# Debian 12 usa a hierarquia unificada (cgroup v2). Confirme com:
#   stat -fc %T /sys/fs/cgroup     -> cgroup2fs
CgroupPlugin=cgroup/v2

# --- o que confinar ----------------------------------------------------
# Núcleos: o job só enxerga os núcleos que lhe foram alocados. Sem isto, um
# programa que detecta "16 núcleos disponíveis" abre 16 threads dentro de uma
# alocação de 2, e compete com os vizinhos.
ConstrainCores=yes

# Memória: o limite passa a ser aplicado pelo núcleo do sistema.
ConstrainRAMSpace=yes
AllowedRAMSpace=100

# Swap: sem isto, um job que estoura a RAM escorrega para o swap em vez de
# ser morto, e arrasta o desempenho do nó inteiro para o chão.
ConstrainSwapSpace=yes
AllowedSwapSpace=0

# Dispositivos: sem GPU neste laboratório, não há o que restringir.
ConstrainDevices=no
